```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travail en cours</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 25px;
            animation: rotate 4s linear infinite;
        }

        h1 {
            font-size: clamp(28px, 5vw, 42px);
            margin-bottom: 15px;
        }

        p {
            color: #a0a5b5;
            font-size: 16px;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 18px;
            border: 1px solid #343846;
            border-radius: 30px;
            background: #191c25;
            color: #a5b4fc;
            font-size: 13px;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 8px;
            border-radius: 50%;
            background: #818cf8;
            animation: pulse 1.5s infinite;
        }

        footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            color: #555b6e;
            font-size: 12px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="icon">⚙️</div>

        <h1>Travail en cours</h1>

        <p>
            Ce projet est actuellement en développement.<br>
            Revenez bientôt pour découvrir la suite !
        </p>

        <div class="status">
            <span class="dot"></span>
            En cours de développement
        </div>
    </main>

    <footer>
        &copy; 2026 — Tous droits réservés
    </footer>
</body>
</html>
```
